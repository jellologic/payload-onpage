name: Version
# On main: Changesets opens/updates a "Version packages" PR. Once it is merged (no
# changesets left), a draft GitHub Release is prepared for the new version.
# Publishing that release is what publishes to npm (see release.yml).
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency: version

jobs:
  version:
    if: github.repository == 'jellologic/payload-onpage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version-packages # also refreshes bun.lock, which bun pm pack reads
          title: Version packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Draft the release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          if npm view "@payload-onpage/core@$v" version >/dev/null 2>&1; then
            echo "v$v is already on npm"; exit 0
          fi
          if gh release list --json tagName -q '.[].tagName' | grep -qx "v$v"; then
            echo "a release for v$v already exists"; exit 0
          fi
          # This version's section of the changelog, else GitHub's generated notes.
          awk -v h="## $v" '$0==h{f=1;next} f&&/^## /{exit} f' packages/core/CHANGELOG.md 2>/dev/null > notes.md || true
          if [ -s notes.md ]; then set -- --notes-file notes.md; else set -- --generate-notes; fi
          gh release create "v$v" --draft --title "v$v" --target "$GITHUB_SHA" "$@"
