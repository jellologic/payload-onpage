name: Release
# On main: Changesets opens/updates a "Version packages" PR. Merging it publishes
# every package whose version isn't on npm yet (with provenance), tags and creates
# GitHub Releases.
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance / trusted publishing
concurrency: release

jobs:
  release:
    if: github.repository == 'jellologic/payload-onpage'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: node scripts/release.mjs
          title: Version packages
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional with npm trusted publishing configured; used when present.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
