name: Release
# Publishing a GitHub Release tagged v<version> publishes every @payload-onpage/*
# package at that version to npm, with provenance, via npm trusted publishing (OIDC).
# version.yml drafts the release; a maintainer reviews and publishes it.
on:
  release:
    types: [published]
  workflow_dispatch: # re-run for a tag: run it from the tag, not a branch
permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance
concurrency: release

jobs:
  publish:
    if: github.repository == 'jellologic/payload-onpage'
    runs-on: ubuntu-latest
    environment: npm # deployments allowed from v* tags only
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          v=$(node -p "require('./packages/core/package.json').version")
          test "$GITHUB_REF" = "refs/tags/v$v" || { echo "::error::$GITHUB_REF is not refs/tags/v$v"; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: node scripts/release.mjs
