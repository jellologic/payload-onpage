name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Ideally against examples/basic, or a minimal repo.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: '@payload-onpage/* 0.x, payload 3.x, next 16.x, react 19.x, node 22'
    validations:
      required: true
